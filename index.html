<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Design Canvas – Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>
</head>
<body>

    <header class="app-header">
        <div class="logo">Design<span>Canvas</span></div>
        <div class="header-actions">
            <button id="paste-btn" class="secondary-btn">Paste Code</button>
            <button id="download-btn" class="primary-btn">Download Full HD</button>
        </div>
    </header>

    <main class="app-container">
        <section class="editor-section">
            <div class="section-header">
                <h3>Paste AI Code Here (HTML/Tailwind/SVG/FontAwesome)</h3>
            </div>
            <textarea id="code-input" placeholder="<div class='text-center p-8'>\n  <i class='fa-solid fa-rocket text-blue-500 text-4xl'></i>\n</div>"></textarea>
        </section>

        <section class="preview-section">
            <div class="section-header">
                <h3>Live Preview</h3>
            </div>
            <div class="canvas-wrapper">
                <div id="render-area"></div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
