<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Design Canvas – Local Assets + Short IDs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>
</head>
<body>

    <header class="app-header">
        <div class="logo">Design<span>Canvas</span></div>
        <div class="flex gap-3">
            <button id="download-btn" class="primary-btn">⬇️ Download HD PNG</button>
        </div>
    </header>

    <main class="app-container">
        <section class="editor-section">
            <div class="section-header">
                <h3>✏️ Paste AI Code (supports $A, $B, $C ... placeholders)</h3>
            </div>
            <textarea id="code-input" placeholder='Example: <img src="$A" class="w-32 h-32 rounded-full shadow-lg">\n<div class="bg-white/80 backdrop-blur p-6 rounded-2xl">...</div>'></textarea>
            
            <div class="image-manager">
                <div class="manager-header">
                    <span class="text-xs font-semibold text-gray-600">📸 Local Assets (IndexedDB)</span>
                    <button id="upload-image-btn" class="upload-btn">+ Upload Image</button>
                </div>
                <div id="image-list" class="image-grid">
                    <div class="empty-assets-msg">No assets yet. Upload PNG/JPG/GIF → gets short ID like "A", "B" → use in code as src="$A"</div>
                </div>
            </div>
        </section>

        <section class="preview-section">
            <div class="section-header">
                <h3>🎯 Live Preview (placeholders replaced with local images)</h3>
            </div>
            <div class="canvas-wrapper">
                <div id="render-area"></div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
